server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The bundle is one ~550 KB chunk; uncompressed it was the slowest part of
  # every login on a mobile connection.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Not framed, no MIME sniffing, and no referrer leaking the admin URL to
  # the sites operators open from it. A full CSP is deliberately not set here:
  # the bundle inlines its styles and talks to an API origin that is runtime
  # configuration (env.js), so a static policy would have to be regenerated
  # by env.sh — a later step.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Long-cache fingerprinted build assets.
  location /assets/ {
    try_files $uri =404;
    expires 7d;
    access_log off;
  }

  # The entry page and the runtime config must never be cached: after a deploy
  # a cached index.html points at asset hashes that no longer exist and the app
  # fails to load until a hard refresh.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location = /env.js {
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback — every other path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
