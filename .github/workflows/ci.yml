name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vite build type-checks and bundles the app.
      - run: npm run build
