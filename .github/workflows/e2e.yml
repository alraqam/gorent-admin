name: E2E (browser)

# Manual trigger only: the browser smoke needs the full stack (admin + api +
# Postgres), so it builds both via Docker. Requires:
#   - the api repo accessible as ${{ github.repository_owner }}/gorent-api
#   - a secret API_REPO_TOKEN (PAT with read access to that repo) if it's private
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admin
        uses: actions/checkout@v4
        with:
          path: admin

      - name: Checkout api
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gorent-api
          path: api
          token: ${{ secrets.API_REPO_TOKEN || github.token }}

      - name: Write CI compose
        run: |
          cat > docker-compose.ci.yml <<'YML'
          name: gorent-ci
          services:
            postgres:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: gorent
                POSTGRES_PASSWORD: gorent
                POSTGRES_DB: gorent
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U gorent -d gorent"]
                interval: 5s
                timeout: 3s
                retries: 15
            api:
              build: ./api
              ports: ["3001:3001"]
              environment:
                DATABASE_URL: postgresql://gorent:gorent@postgres:5432/gorent?schema=public
                JWT_SECRET: ci-e2e-secret-0123456789
                CORS_ORIGINS: http://localhost:8080
                SEED_DEMO: "true"
              depends_on:
                postgres:
                  condition: service_healthy
            admin:
              build: ./admin
              ports: ["8080:80"]
              depends_on: [api]
          YML

      - name: Build & start stack
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            a=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || true)
            b=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$a" = "200" ] && [ "$b" = "200" ]; then echo "stack up"; exit 0; fi
            sleep 3
          done
          echo "stack did not become healthy"; docker compose -f docker-compose.ci.yml logs --tail=50; exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install deps + browser
        working-directory: admin
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: admin
        env:
          BASE_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report
          if-no-files-found: ignore
